version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "db/query/memory.sql"
    schema:
      - "db/migrations/000001_memory_schema.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/sqlc"
        emit_json_tags: true
        json_tags_case_style: camel
        sql_package: "pgx/v5"
        overrides:
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
