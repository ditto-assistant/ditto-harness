name: ci

# Manual-only for now: the org's GitHub Actions budget is exhausted, so
# push/PR-triggered runs fail to start ("Actions budget is preventing further
# use") and show a spurious red X. Run on demand via the Actions tab. To restore
# automatic CI, raise the Actions spending limit in org Settings → Billing, then
# re-add the `push`/`pull_request` triggers below.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DITTO_HARNESS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go tool sqlc generate -f sqlc.yaml
      - run: git diff --exit-code pkg/db
      - run: go test ./...
