# CLA Assistant Lite — Contributor License Agreement enforcement
#
# This workflow uses contributor-assistant/github-action to collect and verify
# CLA signatures on pull requests.
#
# MAINTAINER SETUP REQUIRED:
# ===========================
# Before this workflow can store signatures you must create a GitHub secret:
#
#   Secret name : PERSONAL_ACCESS_TOKEN
#   Value       : A GitHub Personal Access Token (classic) with the following
#                 scopes: repo (full), workflow
#                 OR a fine-grained PAT with read/write access to:
#                   - Contents (to commit signatures to the signatures branch)
#                   - Pull requests (to post/update bot comments)
#                   - Issues (to read issue_comment events)
#
# Add the secret at:
#   https://github.com/ditto-assistant/ditto-harness/settings/secrets/actions
#
# The GITHUB_TOKEN built into Actions does NOT have sufficient permissions to
# push to the signatures branch, which is why a PAT is required.
#
# SIGNATURE STORAGE:
# ==================
# Signatures are stored as a JSON file committed to the `cla-signatures` branch
# of this repository at the path `signatures/cla.json`. The branch is created
# automatically on the first signature.
#
# CLA DOCUMENT:
# =============
# The CLA text is in CLA.md at the root of this repository.

name: CLA Assistant

on:
  # Runs on every new or updated pull request (including from forks).
  # pull_request_target is required (not pull_request) so the workflow has
  # write access to post comments and commit signatures even for fork PRs.
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Runs when a contributor comments on a PR (e.g., "I have read the CLA…").
  issue_comment:
    types: [created]

permissions:
  # Required to post and update the CLA bot comment on the PR.
  pull-requests: write
  # Required to read PR details and issue comments.
  issues: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    # Only run on pull request events or on comments that contain the CLA
    # re-check trigger phrase.
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'recheck'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # The built-in GITHUB_TOKEN is used for read operations.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT is required for write operations (committing signatures,
          # posting comments). Set this secret in repo Settings → Secrets.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # Path within the signatures branch where the JSON signature file
          # is stored.
          path-to-signatures: signatures/cla.json

          # Branch used to store CLA signatures. Created automatically.
          branch: cla-signatures

          # The text contributors must comment to record their agreement.
          # Must match exactly (case-insensitive) what the bot instructs them
          # to type.
          allowlist: bot*

          # Custom message posted on the PR when a contributor has not yet
          # signed the CLA.
          # The placeholder ${{ github.event.pull_request.user.login }} is
          # expanded by the action itself.
          custom-notsigned-prcomment: |
            ## Contributor License Agreement

            Thank you for your contribution to **ditto-harness**!

            Before your pull request can be merged, you must sign the
            [Contributor License Agreement (CLA)](https://github.com/ditto-assistant/ditto-harness/blob/main/CLA.md).

            **To sign**, please read [CLA.md](https://github.com/ditto-assistant/ditto-harness/blob/main/CLA.md)
            and then post the following comment on this pull request:

            > I have read the CLA Document and I hereby sign the CLA

            If you are signing on behalf of a company or other legal entity,
            contact [licensing@omniaura.ai](mailto:licensing@omniaura.ai) to
            arrange an entity signature.

          # The exact phrase contributors must post to record their signature.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"

          # Message posted after a contributor successfully signs.
          custom-allsigned-prcomment: |
            ## ✅ CLA Signed

            All contributors have signed the Contributor License Agreement.
            Thank you!
