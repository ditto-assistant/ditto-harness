name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add PERSONAL_ACCESS_TOKEN="$PERSONAL_ACCESS_TOKEN" --repo ditto-assistant/ditto-harness
